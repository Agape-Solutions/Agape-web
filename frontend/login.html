<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agape Solutions - Login</title>

    <link rel="icon" type="image/x-icon" href="./assets/imgs/icon.png">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

    <main class="login-container">
        <section class="login-brand">

            <div class="brand-content">

                <h1>
                    <span>Kineo</span> que
                    <span>cuida.</span>
                </h1>

                <p>
                    Soluções inteligentes para transformar
                    a gestão e o acompanhamento em saúde.
                </p>

            </div>

            <div class="brand-decoration decoration-one"></div>
            <div class="brand-decoration decoration-two"></div>

        </section>

        <section class="login-form-area">

            <div class="login-card">

                <div class="login-header">

                    <span class="welcome">
                        Bem-vindo
                    </span>

                    <h2>
                        Acesse sua conta
                    </h2>

                    <p>
                        Entre com seus dados para continuar.
                    </p>

                </div>


                <form>

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="label-row">

                            <label for="password">
                                Senha
                            </label>

                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Entrar
                    </button>

                </form>


                <div class="login-footer">

                    <p>
                        Agape Solutions
                    </p>

                    <span>
                        © 2026
                    </span>

                </div>

            </div>

        </section>

    </main>
    <script src="js/login.js"></script>
</body>

</html>
